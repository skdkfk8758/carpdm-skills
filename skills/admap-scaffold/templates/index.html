<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>{{TITLE}}</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@{{MAPLIBRE_VERSION}}/dist/maplibre-gl.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family:
          'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      #title {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 1;
        padding: 10px 14px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        box-shadow: 0 1px 3px rgb(15 23 42 / 8%);
        font-size: 14px;
        font-weight: 600;
        color: #0f172a;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="title">{{TITLE}}</div>

    <script src="https://unpkg.com/maplibre-gl@{{MAPLIBRE_VERSION}}/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@{{PMTILES_VERSION}}/dist/pmtiles.js"></script>
    <script src="./style.js"></script>
    <script>
      // ADMap style snapshot — 생성 시점에 굳었다. ADMap 쪽 변경은 스캐폴드를 다시
      // 돌려야 반영된다. style.js 를 손으로 고치지 말 것 (OVERLAY-RULES.md 참조).
      // 스타일을 URL 이 아니라 객체로 넘긴다 — file:// 에서 로컬 fetch 가 막히기 때문.
      maplibregl.addProtocol('pmtiles', new pmtiles.Protocol().tile);

      const map = new maplibregl.Map({
        container: 'map',
        style: window.__ADMAP_STYLE__,
        center: [{{CENTER_LNG}}, {{CENTER_LAT}}],
        zoom: {{ZOOM}},
      });

      map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
      map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: 'metric' }), 'bottom-left');

      map.on('load', () => {
        // ── 오버레이는 여기부터 ──────────────────────────────────────────
        // 자기 데이터(매체 포인트·구역·히트맵)는 data/ 에 두고 여기서 얹는다.
        // 규칙은 OVERLAY-RULES.md 에 있다. 그 규칙을 먼저 읽을 것.
      });
    </script>
  </body>
</html>
