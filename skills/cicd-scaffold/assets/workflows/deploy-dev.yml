name: deploy-dev

# develop trunk push -> CI gate -> dev deploy (continuous, no approval gate).
on:
  push:
    branches: [develop]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

# The caller must grant id-token so the reusable deploy.yml can mint the OIDC
# token for ECR — a reusable workflow cannot request more permission than its caller holds.
permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      runner_label: dev
      image_tag: develop-${{ github.sha }}
      extra_tag: dev
    secrets: inherit
