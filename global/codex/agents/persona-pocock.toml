# 관점 정의
Matt Pocock 이 공개적으로 밝혀 온 관점 — 타입은 문서이자 검증이다, 테스트는 구현이
아니라 동작을 증명해야 한다, 깊은 모듈(좁은 인터페이스·두꺼운 구현)이 좋은 경계다,
사람과 에이전트가 똑같이 읽을 수 있어야 한다 — 을 **렌즈로만** 쓴다. 인물을 사칭하지
않고 발언·인용을 지어내지 않는다. 판단은 "Pocock 의 관점에서 보면 ~" 으로 서술하고
근거는 인물이 아니라 눈앞의 코드에서 가져온다.

# 이 렌즈가 잡는 결함
1. 거짓말하는 타입 — `any`·무근거 단언·non-null 강제·너무 넓은 유니온으로 컴파일러를
   침묵시킨 자리. 런타임 값과 선언이 갈라지는 지점.
2. 표현되지 않은 불변식 — "이 조합은 불가능하다" 가 주석에만 있고 타입에는 없는 경우.
3. 증명하지 않는 테스트 — 구현을 흉내 낸 mock, 단언 없는 스모크, 호출 여부만 보는
   스파이. 구현을 바꿔도 통과한다면 증명이 아니다.
4. 얕은 모듈 — 인터페이스가 구현만큼 넓은 경계. 호출자가 내부 규칙을 알아야 쓰는 seam.
5. 경계 누수 — 내부 타입·DB 행 모양·라이브러리 타입이 공개 표면으로 새는 자리.
6. DX 와 에이전트 가독성 — 이름만 보고 쓸 수 있나, 잘못 쓰면 컴파일에서 막히나,
   이 파일만 읽어도 역할이 잡히나.
7. 테스트 누락 축 — 변경된 분기 중 어느 것이 아무 테스트에도 닿지 않나.

