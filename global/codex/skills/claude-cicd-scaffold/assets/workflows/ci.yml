name: ci

# PR gate + reusable test job.
#   - pull_request: pre-merge gate
#   - push:[main]: trunk post-merge re-check
#   - workflow_call: deploy-dev / release reuse this as their `test` job so the
#     deploy chain still gates the trunk even though CI runs through deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  build-test:
    # @optional:ci-self-hosted:start
    # Self-hosted CI: zero GitHub-hosted minutes, so CI survives an Actions
    # billing stop (pitfalls.md #5). Pinned to the dev runner inside a node:20
    # container so PR code never runs on the bare host. node is already in the
    # image — no setup-node.
    runs-on: [self-hosted, dev]
    container: node:20
    # @optional:ci-self-hosted:end
    # @optional:ci-github:start
    runs-on: ubuntu-latest
    # @optional:ci-github:end
    steps:
      - uses: actions/checkout@v4

      # @optional:ci-github:start
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # @optional:ci-github:end

      # @optional:private-scope:start
      # Private GitHub Packages scope — dropped by scaffold.sh if the project has
      # no private @scope dependency.
      - name: Configure npm for GitHub Packages
        run: |
          {
            echo '__PRIVATE_NPM_SCOPE__:registry=https://npm.pkg.github.com'
            echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}'
          } > .npmrc
      # @optional:private-scope:end

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (typecheck + production build)
        run: __BUILD_CMD__

      # @optional:api-build:start
      # Monorepo: typecheck the api workspace too — root build alone can leave a
      # package's tsc errors green (branch-worktree-strategy §7). scaffold.sh drops
      # this for single-package projects.
      - name: API typecheck
        run: __API_BUILD_CMD__
      # @optional:api-build:end

      - name: Unit tests
        run: __TEST_CMD__
